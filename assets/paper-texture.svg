<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="493" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope="0.22" intercept="0.72" />
        <feFuncG type="linear" slope="0.2" intercept="0.7" />
        <feFuncB type="linear" slope="0.16" intercept="0.66" />
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
    </filter>
    <filter id="fiber">
      <feTurbulence type="turbulence" baseFrequency="0.018 0.55" numOctaves="2" seed="91" />
      <feColorMatrix type="matrix" values=".3 0 0 0 .64  0 .28 0 0 .62  0 0 .22 0 .56  0 0 0 .18 0" />
    </filter>
  </defs>
  <rect width="640" height="640" fill="#ded9cd" />
  <rect width="640" height="640" filter="url(#paper)" opacity=".65" />
  <rect width="640" height="640" filter="url(#fiber)" opacity=".28" />
</svg>
